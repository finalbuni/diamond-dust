# CHAPTER 01

hani:
  term: "Hani (한이)"
  text: "An affectionate nickname formed by attaching the endearing suffix -i to the character's final syllable (Yeehan → Han → Hani)."

hyung:
  term: "Hyung (형)"
  text: "Most commonly means \"older brother\" in Korean, used by a younger male to address or refer to an older male."

nuna:
  term: "Nuna (누나)"
  text: "Most commonly means \"older sister\" in Korean, used by a male to address or refer to an older female."

hyeoni:
  term: "Hyeoni (현이)"
  text: "An affectionate nickname formed by attaching the endearing suffix -i to the character's final syllable (Yeehyeon → Hyeon → Hyeoni)."

hyeon-ah:
  term: "Hyeon-ah (현아)"
  text: "An affectionate way of calling out to someone. Close friends and family may shorten a name and attach the vocative suffix -ah to the final syllable (Yeehyeon → Hyeon → Hyeon-ah)."