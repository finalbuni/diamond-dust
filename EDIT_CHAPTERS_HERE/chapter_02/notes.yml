# CHAPTER 02

sunbae:
  term: "Sunbae (선배)"
  text: "Most commonly means \"senior\" in Korean, used to address or refer to someone with more experience in a school, workplace, military, or professional field."

yuni-ya:
  term: "Yuni-ya (유니야)"
  text: "The suffix -ya (야) is an affectionate way of calling out to or addressing someone close in age or status, added to names ending in a vowel."

yoon-nim:
  term: "Yoon-nim (윤 님)"
  text: "The suffix -nim (님) is a respectful honorific added to a person's name or title to show a high degree of respect."

ssi:
  term: "Juhan-ssi and Yeehyeon-ssi (-씨)"
  text: "The suffix -ssi (씨) is a polite honorific used when addressing someone of equal or lower professional status, somewhat like \"Mr.\" or \"Ms.\" Here, its use between peers who have just met establishes a courteous, professional distance rather than close familiarity."

yeehyeonie:
  term: "Yeehyeonie (이현이)"
  text: "An affectionate nickname formed by attaching the endearing suffix -i directly to the full given name, often used by someone close to the person. Here, Yeehyeon's former teacher uses it with the familiarity and fondness of someone who has known him since childhood."

inwu-ssaem:
  term: "Inwu ssaem (인우 쌤)"
  text: "Ssaem (쌤) is a casual, affectionate contraction of seonsaengnim (선생님), used here to show warmth and familiarity toward Inwu as a teacher and mentor."