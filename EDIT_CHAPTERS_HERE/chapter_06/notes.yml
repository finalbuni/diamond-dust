# CHAPTER 06

suki-kim-seonsaengnim:
  term: "Ms. Suki Kim"
  text: "The Korean uses \"Suki Kim seonsaengnim\" (수키 김 선생님). Seonsaengnim literally means \"teacher,\" but can also be used as a respectful title for established professionals, mentors, or senior figures. Because \"Teacher Suki Kim\" would suggest something different in English, it has been adapted to \"Ms. Suki Kim\" here."