<div class="reader-sheet-backdrop" data-reader-sheet-close hidden></div>

<section class="reader-sheet" id="reader-settings" aria-label="Reading settings" aria-hidden="true">
    <div class="reader-sheet-handle" aria-hidden="true" data-sheet-drag-handle></div>

    <div class="reader-sheet-header">
        <div>
            <h2>Reading Settings</h2>
        </div>

        <button class="icon-button reader-sheet-close" type="button" aria-label="Close reading settings" data-reader-sheet-close>×</button>
    </div>

    <div class="reader-setting-group">
        <div class="reader-setting-heading"><span>Appearance</span></div>
        <div class="segmented-control" role="group" aria-label="Appearance">
            <button type="button" data-theme-choice="light"><span aria-hidden="true">☼</span> Light</button>
            <button type="button" data-theme-choice="dark"><span aria-hidden="true">☾</span> Dark</button>
        </div>
    </div>

    <div class="reader-setting-group">
        <div class="reader-setting-heading"><span>Reading font</span></div>
        <div class="font-options" role="group" aria-label="Reading font">
            <button type="button" class="font-option font-source" data-font-choice="source">Source Serif 4</button>
            <button type="button" class="font-option font-newsreader" data-font-choice="newsreader">Newsreader</button>
            <button type="button" class="font-option font-inter" data-font-choice="inter">Inter</button>
            <button type="button" class="font-option font-manrope" data-font-choice="manrope">Manrope</button>
        </div>
    </div>

    <div class="reader-setting-group">
        <div class="reader-setting-heading">
            <label for="reader-font-size">Text size</label>
            <output id="reader-font-size-value" for="reader-font-size">20px</output>
        </div>
        <input id="reader-font-size" class="reader-range" type="range" min="0" max="7" step="1" value="2" aria-valuetext="20 pixels">
    </div>

    <div class="reader-setting-group">
        <div class="reader-setting-heading">
            <label for="reader-line-height">Line spacing</label>
            <output id="reader-line-height-value" for="reader-line-height">1.6</output>
        </div>
        <input id="reader-line-height" class="reader-range" type="range" min="1.4" max="1.8" step="0.1" value="1.6">
    </div>

    {% if page.chapter_number %}
    <div class="reader-setting-group hybrid-settings-group">
        <div class="reader-setting-heading"><label for="hybrid-settings-format">Reading format</label></div>
        <select id="hybrid-settings-format" class="hybrid-settings-select" aria-label="Reading format">
            <option value="full" {% unless page.hybrid_short %}selected{% endunless %}>Full chapter</option>
            <option value="short" {% if page.hybrid_short %}selected{% endif %}>Short sections</option>
        </select>
    </div>
    {% endif %}


    <button type="button" class="reader-reset" data-reader-reset>Reset reading settings</button>
</section>
